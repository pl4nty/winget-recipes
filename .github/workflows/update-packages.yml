name: Update Packages

on:
  workflow_dispatch:
  schedule:
    - cron: 37 * * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-packages:
    name: Update Packages
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.22
          install_args: bun

      - name: Install Dependencies
        run: bun ci --production

      - name: Update Packages
        run: |
          status=0
          bun start || status=$?
          sed -n 's|^Pull Request: \(https://.*\)$|\1|p' "$GITHUB_STEP_SUMMARY" | while read -r url; do
            gh api graphql -f query='mutation($id: ID!) { updateSubscription(input: {subscribableId: $id, state: IGNORED}) { clientMutationId } }' -f id="$(gh pr view "$url" --json id --jq .id)"
          done
          exit "$status"
        env:
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}
