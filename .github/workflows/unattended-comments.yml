name: Unattended Comments

on:
  push:
    branches:
      - claude/project-thread-r5tdfj-comments

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  comments:
    name: Unattended Comments
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.22
          install_args: bun

      - name: Fetch Comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun unattended-comments.ts

      - name: Upload Comments
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unattended-comments
          path: unattended-comments.json
