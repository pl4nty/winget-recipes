name: Dry Run

on:
  pull_request:
    paths:
      - .github/workflows/dry-run.yml
  workflow_dispatch:
  schedule:
    - cron: 37 5 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  dry-run:
    name: Dry Run
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    env:
      NAPI_RS_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/anthelion-komac.node
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.22
          install_args: bun

      - name: Install Dependencies
        run: bun ci --production

      - name: Install komac
        run: curl -fsSLo "$NAPI_RS_NATIVE_LIBRARY_PATH" https://github.com/devicie/Komac-anthelion/releases/latest/download/anthelion-komac.linux-arm64-gnu.node

      # Shards in shards/dry-run never submit: the scheduled update reads only shards/json and shards/script.
      - name: Find New Versions
        run: |
          [ -d shards/dry-run ] || exit 0
          status=0
          bun test:shard all --dry-run || status=$?
          echo '### New versions' >> "$GITHUB_STEP_SUMMARY"
          sed -n 's|^#### \(manifests/.*\.installer\.yaml\)$|\1|p' "$GITHUB_STEP_SUMMARY" | while read -r path; do
            curl -fsIo /dev/null "https://raw.githubusercontent.com/microsoft/winget-pkgs/master/$path" && continue
            version=$(basename "$(dirname "$path")")
            id=$(basename "$path" .installer.yaml)
            echo "::notice title=$id::new version $version"
            echo "- $id $version" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
        env:
          ANTHELION_SHARDS_DIR: shards/dry-run
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
