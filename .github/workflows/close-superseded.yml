name: Close Superseded

on:
  workflow_dispatch:
  schedule:
    - cron: 41 */6 * * *

permissions: {}

jobs:
  close-superseded:
    name: Close Superseded
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.22
          install_args: bun

      - name: Close Superseded PRs
        run: bun close-superseded.ts --close | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
