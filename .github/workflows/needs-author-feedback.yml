name: Needs Author Feedback

on:
  pull_request:
    paths:
      - .github/workflows/needs-author-feedback.yml
      - needs-author-feedback.ts
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  needs-author-feedback:
    name: Needs Author Feedback
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.22
          install_args: bun

      - name: Triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun needs-author-feedback.ts | tee -a "$GITHUB_STEP_SUMMARY"

