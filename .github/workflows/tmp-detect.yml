name: Tmp Detect

on:
  push:
    branches: [claude/project-thread-6o8mnw]

permissions:
  contents: write

jobs:
  find-updates:
    name: Find Updates
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        batch: [0]
    timeout-minutes: 30
    env:
      NAPI_RS_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/anthelion-komac.node
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.22
          install_args: bun

      - name: Select Batch
        run: find shards -type f | sort | awk -v batch="$BATCH" 'NR > 40' | xargs -r rm
        env:
          BATCH: ${{ matrix.batch }}

      - name: Install Dependencies
        run: bun ci --production

      - name: Install komac
        run: curl -fsSLo "$NAPI_RS_NATIVE_LIBRARY_PATH" https://github.com/devicie/Komac-anthelion/releases/latest/download/anthelion-komac.linux-arm64-gnu.node

      - name: Find Updates
        run: bun start | sed -n 's/^Candidate: //p' > "candidates-$BATCH.txt"
        env:
          ANTHELION_DETECT: 1
          BATCH: ${{ matrix.batch }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}

      - name: Upload Candidates
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidates-${{ matrix.batch }}
          path: candidates-${{ matrix.batch }}.txt

